name: Update NASA FIRMS

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test NASA FIRMS connection
        run: |
          curl -I \
              --connect-timeout 30 \
              --max-time 60 \
              --retry 3 \
              --retry-delay 5 \
              https://firms.modaps.eosdis.nasa.gov

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python scripts/run_pipeline_v2.py

      - name: Add rainfall to fire events
        run: |
          python scripts/get_rainfall_events.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/v2/

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update NASA FIRMS data"

          for i in 1 2 3 4 5
          do
            echo "Push attempt $i"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 5
          done

          echo "Push failed after 5 attempts."
          exit 1
