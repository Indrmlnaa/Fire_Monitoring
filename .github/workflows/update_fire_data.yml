name: Fire Monitoring Pipeline

on:
  workflow_dispatch:
  schedule:
    # Run every 3 hours
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  fire-monitoring:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. SETUP JOB
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. TEST NASA FIRMS CONNECTION
      # ============================================================
      - name: Test NASA FIRMS connection
        run: |
          echo "============================================================"
          echo "TESTING NASA FIRMS CONNECTION"
          echo "============================================================"

          curl -I \
            --connect-timeout 15 \
            --max-time 30 \
            https://firms.modaps.eosdis.nasa.gov || true

          echo ""
          echo "Connection test completed."

      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            requests \
            geopandas \
            shapely \
            pyproj \
            fiona \
            scikit-learn

      # ============================================================
      # 5. TEST NASA FIRMS MAP KEY
      # ============================================================
      - name: Test FIRMS MAP KEY
        env:
          FIRMS_MAP_KEY: ${{ secrets.MAP_KEY }}
        run: |
          echo "============================================================"
          echo "TESTING NASA FIRMS MAP KEY"
          echo "============================================================"

          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "ERROR: FIRMS_MAP_KEY is empty!"
            exit 1
          fi

          echo "MAP_KEY is present."
          echo "MAP_KEY length: ${#FIRMS_MAP_KEY}"

          echo ""
          echo "Checking MAP_KEY status..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            "https://firms.modaps.eosdis.nasa.gov/mapserver/mapkey_status/?MAP_KEY=${FIRMS_MAP_KEY}"

          echo ""
          echo "============================================================"
          echo "MAP KEY TEST COMPLETED"
          echo "============================================================"

      # ============================================================
      # 6. RUN FIRE MONITORING PIPELINE
      # ============================================================
      - name: Run pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.MAP_KEY }}
        run: |
          echo "============================================================"
          echo "RUNNING FIRE MONITORING PIPELINE"
          echo "============================================================"

          python scripts/run_pipeline_v2.py

      # ============================================================
      # 7. CHECK FIRE MONITORING OUTPUT
      # ============================================================
      - name: Check fire monitoring output
        run: |
          echo "============================================================"
          echo "FIRE MONITORING OUTPUT"
          echo "============================================================"

          ls -lh data/v2/processed/

          echo ""
          echo "Fire events:"

          test -f \
            data/v2/processed/OKI_NASA_FIRMS_fire_events.csv

          wc -l \
            data/v2/processed/OKI_NASA_FIRMS_fire_events.csv

          echo ""
          echo "Spatial analysis:"

          test -f \
            data/v2/processed/OKI_NASA_FIRMS_spatial_analysis.csv

          wc -l \
            data/v2/processed/OKI_NASA_FIRMS_spatial_analysis.csv

      # ============================================================
      # 8. ADD RAINFALL TO FIRE EVENTS
      # ============================================================
      - name: Add rainfall to fire events
        run: |
          echo "============================================================"
          echo "ADDING RAINFALL DATA"
          echo "============================================================"

          python scripts/get_rainfall_events.py

      # ============================================================
      # 9. VERIFY RAINFALL OUTPUT
      # ============================================================
      - name: Verify rainfall output
        run: |
          echo "============================================================"
          echo "RAINFALL OUTPUT"
          echo "============================================================"

          FILE="data/v2/processed/OKI_fire_events_rainfall.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Rainfall file was not created!"
            exit 1
          fi

          echo ""
          echo "File:"
          ls -lh "$FILE"

          echo ""
          echo "Line count:"
          wc -l "$FILE"

          echo ""
          echo "Preview:"
          head -5 "$FILE"

          echo ""
          echo "Last records:"
          tail -5 "$FILE"

          echo ""
          echo "Git status:"
          git status --short

          echo ""
          echo "Check if ignored:"
          git check-ignore -v "$FILE" || true

      # ============================================================
      # 10. FORCE ADD GENERATED DATA
      # ============================================================
      - name: Stage updated data
        run: |
          echo "============================================================"
          echo "STAGING UPDATED DATA"
          echo "============================================================"

          git add -f \
            data/v2/processed/OKI_NASA_FIRMS_fire_events.csv

          git add -f \
            data/v2/processed/OKI_NASA_FIRMS_spatial_analysis.csv

          git add -f \
            data/v2/processed/OKI_fire_events_rainfall.csv

          echo ""
          echo "Staged changes:"
          git status --short

      # ============================================================
      # 11. COMMIT UPDATED DATA
      # ============================================================
      - name: Commit updated data
        run: |
          echo "============================================================"
          echo "COMMITTING UPDATED DATA"
          echo "============================================================"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update fire monitoring data"
            echo "Data committed successfully."
          fi

      # ============================================================
      # 12. PUSH TO GITHUB
      # ============================================================
      - name: Push updated data
        run: |
          echo "============================================================"
          echo "PUSHING UPDATED DATA"
          echo "============================================================"

          git push origin HEAD:${GITHUB_REF_NAME}

      # ============================================================
      # 13. FINAL CHECK
      # ============================================================
      - name: Final status
        run: |
          echo "============================================================"
          echo "PIPELINE COMPLETED"
          echo "============================================================"

          echo ""
          echo "Repository:"
          git remote -v

          echo ""
          echo "Current commit:"
          git log -1 --oneline

          echo ""
          echo "Generated files:"
          ls -lh data/v2/processed/

          echo ""
          echo "============================================================"
          echo "FIRE MONITORING PIPELINE FINISHED"
          echo "============================================================"
