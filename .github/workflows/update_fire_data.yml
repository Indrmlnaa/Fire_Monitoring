name: Update NASA FIRMS

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test NASA FIRMS connection
        run: |
          curl -I --connect-timeout 15 https://firms.modaps.eosdis.nasa.gov

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python scripts/run_pipeline_v2.py

      - name: Commit updated data
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git fetch origin main
      git reset --hard origin/main

      git add data/v2/

      if git diff --cached --quiet; then
        echo "No data changes."
      else
        git commit -m "Update NASA FIRMS data"
        git push origin HEAD:main
      fi
